<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Assembly Midterm — اختبار تفاعلي</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#17233c;--muted:#667085;--blue:#244b8f;--green:#13804a;--red:#c43d43;}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Tahoma,sans-serif;line-height:1.65}
header{background:linear-gradient(120deg,#142b55,#315fa8);color:white;padding:25px 18px;text-align:center}
header h1{margin:0 0 6px;font-size:25px} header p{margin:0;color:#e5edff}
main{max-width:900px;margin:20px auto;padding:0 14px}
.toolbar{background:#fff;padding:14px;border-radius:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;box-shadow:0 3px 14px #1c31500d;position:sticky;top:6px;z-index:5}
select,button{font:inherit;border-radius:9px;padding:10px 13px;border:1px solid #d5dbea;background:white;color:var(--ink)}
button{cursor:pointer;font-weight:bold} .primary{background:var(--blue);color:#fff;border-color:var(--blue)} .soft{background:#edf2fb}
#progress{margin-right:auto;color:var(--muted);font-size:14px}
.question{background:var(--card);margin:14px 0;padding:17px;border-radius:14px;box-shadow:0 3px 14px #1c31500b;border:1px solid #e7eaf1}
.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:13px;margin-bottom:8px}
.badge{background:#edf2fb;color:#244b8f;border-radius:30px;padding:3px 9px} .repeat{background:#fff0c7;color:#815900;font-weight:bold}
.qtext{font-size:17px;font-weight:700;margin:7px 0 12px;direction:ltr;text-align:left}
.option{display:flex;gap:9px;align-items:flex-start;padding:9px 10px;border:1px solid #e3e7ef;border-radius:9px;margin:7px 0;direction:ltr;text-align:left;cursor:pointer}
.option:hover{background:#f5f8ff} .option input{margin-top:5px;accent-color:#244b8f}
.correct{border-color:#61b98a;background:#eaf8f0} .wrong{border-color:#e38a8e;background:#fff0f0}
.feedback{font-size:14px;margin-top:9px;color:var(--muted)} .feedback.good{color:var(--green)} .feedback.bad{color:var(--red)}
#result{display:none;background:#fff;border-radius:14px;padding:20px;margin:16px 0;text-align:center;border:2px solid #dce5f5}
.score{font-size:32px;font-weight:bold;color:var(--blue)} .note{font-size:13px;color:var(--muted)}
footer{text-align:center;color:var(--muted);padding:25px;font-size:13px}
@media(max-width:560px){header h1{font-size:21px} .toolbar{position:static} #progress{width:100%;margin:0}}
</style></head>
<body>
<header><h1>اختبار Assembly — Midterm</h1><p>الامتحانات الثلاثة • اختاري الإجابة ثم اضغطي Submit للتصحيح الفوري</p></header>
<main>
<div class="toolbar">
<label>اختاري الامتحان:
<select id="filter"><option value="all">كل الامتحانات</option><option>2023–2024</option><option>2024–2025</option><option>2025–2026</option></select></label>
<button class="soft" id="shuffle">ترتيب عشوائي</button>
<button class="primary" id="submit">Submit — صححي الإجابات</button>
<button class="soft" id="reset">إعادة المحاولة</button>
<span id="progress"></span>
</div>
<div id="result"></div>
<div id="quiz"></div>
<footer>الأسئلة المكررة بين الامتحانات عليها علامة ⭐ متكرر. الأسئلة ذات الصياغة أو الفكرة المتشابهة تم تمييزها للمراجعة.</footer>
</main>
<script>
const allQuestions=[{"exam": "2023–2024", "num": 1, "q": "Perform 07FB3 + 1B621 (hexadecimal).", "opts": ["235B4", "235C4", "235D4", "235A4"], "ans": "235D4", "repeat": false, "note": ""}, {"exam": "2023–2024", "num": 2, "q": "Perform 1ADB − 1A70 (hexadecimal).", "opts": ["006B", "006C", "235D4", "235A4"], "ans": "006B", "repeat": false, "note": ""}, {"exam": "2023–2024", "num": 3, "q": "Add 01101 + 10001 (binary).", "opts": ["00011", "11110", "11000", "11111"], "ans": "11110", "repeat": false, "note": ""}, {"exam": "2023–2024", "num": 4, "q": "Subtract 00111 from 11000 (binary).", "opts": ["11000", "11001", "10001", "00011"], "ans": "10001", "repeat": false, "note": ""}, {"exam": "2023–2024", "num": 5, "q": "Find the 2’s complement of 0110011.", "opts": ["1001101", "1100111", "1001001", "1100011"], "ans": "1001101", "repeat": false, "note": ""}, {"exam": "2023–2024", "num": 6, "q": "Assembly language is often termed as:", "opts": ["Low-level language", "Middle-level language", "High-level language", "None of the above"], "ans": "Low-level language", "repeat": false, "note": ""}, {"exam": "2023–2024", "num": 7, "q": "Assembly instructions such as ADD and MOV are accompanied by statements called:", "opts": ["Functions", "Files", "Programs", "Directives"], "ans": "Directives", "repeat": false, "note": ""}, {"exam": "2023–2024", "num": 8, "q": "An instruction tells the CPU what to do.", "opts": ["True", "False"], "ans": "True", "repeat": true, "note": ""}, {"exam": "2023–2024", "num": 9, "q": "The mnemonics and operands fields together perform the real work of the program.", "opts": ["True", "False"], "ans": "True", "repeat": false, "note": ""}, {"exam": "2023–2024", "num": 10, "q": "Convert (125)₁₀ to octal.", "opts": ["(157)₈", "(175)₈", "(147)₈", "(167)₈"], "ans": "(175)₈", "repeat": false, "note": ""}, {"exam": "2023–2024", "num": 11, "q": "What is the address space of the x86 processor, as given in the exam?", "opts": ["2¹⁶", "2²⁰", "2²⁴", "2⁸"], "ans": "2²⁰", "repeat": false, "note": ""}, {"exam": "2023–2024", "num": 12, "q": "IP stands for:", "opts": ["Instruction Point", "Instruction Pointer", "Instruction Program", "None of these"], "ans": "Instruction Pointer", "repeat": false, "note": ""}, {"exam": "2023–2024", "num": 13, "q": "Decode ADD AX, 15h.", "opts": ["AX ← AX + 15", "AX ← AX + F", "AX ← 15 + AX", "None of these"], "ans": "AX ← AX + 15", "repeat": false, "note": ""}, {"exam": "2023–2024", "num": 14, "q": "Which translates assembly-language programs into machine instructions?", "opts": ["Debugger", "Interpreter", "Assembler", "Compiler"], "ans": "Assembler", "repeat": false, "note": ""}, {"exam": "2023–2024", "num": 15, "q": "Instructions such as MOV or ADD are called:", "opts": ["OP-Code", "Operators", "Commands", "None of these"], "ans": "OP-Code", "repeat": false, "note": ""}, {"exam": "2023–2024", "num": 16, "q": "The purpose of the microprocessor is to control:", "opts": ["Memory", "Switches", "Processing", "Tasks"], "ans": "Processing", "repeat": false, "note": ""}, {"exam": "2023–2024", "num": 17, "q": "SS stands for:", "opts": ["Single stack", "Stack segment", "Sequence stack", "Random stack"], "ans": "Stack segment", "repeat": false, "note": ""}, {"exam": "2023–2024", "num": 18, "q": "OF stands for:", "opts": ["Overflow flag", "Overdue flag", "One flag", "Overhead flag"], "ans": "Overflow flag", "repeat": false, "note": ""}, {"exam": "2023–2024", "num": 19, "q": "The data size of a word is:", "opts": ["8 bytes", "4 bytes", "2 bytes", "16 bytes"], "ans": "2 bytes", "repeat": false, "note": ""}, {"exam": "2023–2024", "num": 20, "q": "The ALU uses ______ to store intermediate results.", "opts": ["Accumulators", "Registers", "Stack", "None"], "ans": "Accumulators", "repeat": false, "note": ""}, {"exam": "2023–2024", "num": 21, "q": "The IP register is ______ bits in length.", "opts": ["8 bits", "4 bits", "16 bits", "32 bits"], "ans": "16 bits", "repeat": true, "note": ""}, {"exam": "2023–2024", "num": 22, "q": "INC destination increments the destination by:", "opts": ["1", "2", "30", "41"], "ans": "1", "repeat": false, "note": ""}, {"exam": "2023–2024", "num": 23, "q": "The microprocessor is the ______ of the computer and performs computational tasks.", "opts": ["Main", "Heart", "Important", "Simple"], "ans": "Heart", "repeat": false, "note": ""}, {"exam": "2023–2024", "num": 24, "q": "CF is known as:", "opts": ["Carry flag", "Condition flag", "Common flag", "Single flag"], "ans": "Carry flag", "repeat": false, "note": ""}, {"exam": "2023–2024", "num": 25, "q": "AX is formed by grouping:", "opts": ["AH and AL", "BH and BL", "CH and CL", "DH and DL"], "ans": "AH and AL", "repeat": false, "note": ""}, {"exam": "2023–2024", "num": 26, "q": "Which are components of a computer?", "opts": ["System bus", "CPU", "Memory unit", "All of these"], "ans": "All of these", "repeat": false, "note": ""}, {"exam": "2023–2024", "num": 27, "q": "Which are components of a microprocessor?", "opts": ["Register unit", "Arithmetic and logical unit", "Timing and control unit", "All of these"], "ans": "All of these", "repeat": false, "note": ""}, {"exam": "2023–2024", "num": 28, "q": "Which microprocessor was launched by Intel?", "opts": ["Z-80", "8080", "M-6800", "None of these"], "ans": "8080", "repeat": false, "note": ""}, {"exam": "2023–2024", "num": 29, "q": "A small amount of high-speed memory used directly with the microprocessor is:", "opts": ["Cache", "HDD", "ROM", "RAM"], "ans": "Cache", "repeat": false, "note": ""}, {"exam": "2023–2024", "num": 30, "q": "Which microprocessor producers continued successfully creating newer versions?", "opts": ["Intel", "Motorola", "Both A and B", "None of these"], "ans": "Both A and B", "repeat": false, "note": ""}, {"exam": "2024–2025", "num": 1, "q": "The Bus Interface Unit (BIU) executes instructions previously fetched.", "opts": ["True", "False"], "ans": "False", "repeat": false, "note": ""}, {"exam": "2024–2025", "num": 2, "q": "Registers are used to store information permanently.", "opts": ["True", "False"], "ans": "False", "repeat": false, "note": ""}, {"exam": "2024–2025", "num": 3, "q": "SR stands for:", "opts": ["Segment registers", "Stack registers", "Static registers", "None of these"], "ans": "Segment registers", "repeat": false, "note": ""}, {"exam": "2024–2025", "num": 4, "q": "Which transfers program control to a different point in the instruction stream without recording return information?", "opts": ["INT", "JMP", "BNQ", "CMP"], "ans": "JMP", "repeat": false, "note": ""}, {"exam": "2024–2025", "num": 5, "q": "ES stands for:", "opts": ["Extra segment", "Extra Stack", "Extended Stack", "None of these"], "ans": "Extra segment", "repeat": false, "note": ""}, {"exam": "2024–2025", "num": 6, "q": "FR stands for:", "opts": ["Flag register", "Finer register", "Fair register", "None of these"], "ans": "Flag register", "repeat": false, "note": ""}, {"exam": "2024–2025", "num": 7, "q": "Accumulator is usually used to store the return value of a procedure.", "opts": ["True", "False"], "ans": "True", "repeat": false, "note": ""}, {"exam": "2024–2025", "num": 8, "q": "An instruction tells the CPU what to do.", "opts": ["True", "False"], "ans": "True", "repeat": true, "note": ""}, {"exam": "2024–2025", "num": 9, "q": "A flag is set if an arithmetic operation generates a carry or borrow out of the most-significant bit; otherwise it is cleared. Which flag?", "opts": ["Carry Flag", "Parity Flag", "Zero Flag", "Sign Flag"], "ans": "Carry Flag", "repeat": false, "note": ""}, {"exam": "2024–2025", "num": 10, "q": "A flag is set if an arithmetic operation generates a carry or borrow out of bit 3; otherwise it is cleared. Which flag?", "opts": ["Adjust Flag", "Parity Flag", "Zero Flag", "Sign Flag"], "ans": "Adjust Flag", "repeat": false, "note": ""}, {"exam": "2024–2025", "num": 11, "q": "The flag set equal to the most-significant bit of the result (the sign bit) is:", "opts": ["Carry Flag", "Parity Flag", "Zero Flag", "Sign Flag"], "ans": "Sign Flag", "repeat": false, "note": ""}, {"exam": "2024–2025", "num": 12, "q": "Which contains the offset within the code segment of the next instruction to be executed?", "opts": ["EIP", "EBP", "ESP", "EAX"], "ans": "EIP", "repeat": false, "note": ""}, {"exam": "2024–2025", "num": 13, "q": "After MOV AX,7000h; ADD AX,5000h; SUB AX,2000h, what is AL?", "opts": ["25h", "12h", "00h", "None of these"], "ans": "None of these", "repeat": false, "note": "The low byte is 00h."}, {"exam": "2024–2025", "num": 14, "q": "For the same code, what is AH?", "opts": ["0000", "1000", "1500", "None of these"], "ans": "None of these", "repeat": false, "note": "AX becomes A000h, so AH is A0h."}, {"exam": "2024–2025", "num": 15, "q": "Given val1=40000h, val2=60000h, val3=30000h; EAX is loaded with val1 and val2 and val3 are added. What is the low byte AL of the final result?", "opts": ["3000", "2000", "0000", "1000"], "ans": "0000", "repeat": false, "note": "40000h + 60000h + 30000h = 130000h; AL is D0h, so none of the listed values is exact. This source question's options do not contain the computed value."}, {"exam": "2024–2025", "num": 16, "q": "For the same data/code, which is the value of EAH (AH)?", "opts": ["0003", "000E", "0000", "000D"], "ans": "None of these", "repeat": false, "note": "The sum is D0000h, so the AH register contains 00h."}, {"exam": "2024–2025", "num": 17, "q": "The set of all instructions makes up the computer’s:", "opts": ["Commands", "Instructions", "Instruction Set", "None of these"], "ans": "Instruction Set", "repeat": false, "note": ""}, {"exam": "2024–2025", "num": 18, "q": "Which field stands for operation code and specifies the operation to be performed?", "opts": ["Op-Code", "Instructions", "Operands", "None of these"], "ans": "Op-Code", "repeat": false, "note": ""}, {"exam": "2024–2025", "num": 19, "q": "In Assembly Language, the first character of a label must be alphabetic, not a number.", "opts": ["True", "False"], "ans": "True", "repeat": false, "note": ""}, {"exam": "2024–2025", "num": 20, "q": "Which allows you to trace the execution of a program?", "opts": ["Loader", "Assembler", "Linker", "Debugger"], "ans": "Debugger", "repeat": false, "note": ""}, {"exam": "2025–2026", "num": 1, "q": "What is the decimal equivalent of binary (111101)₂?", "opts": ["61", "63", "62", "73"], "ans": "61", "repeat": false, "note": ""}, {"exam": "2025–2026", "num": 2, "q": "Convert decimal 125 to hexadecimal.", "opts": ["(01100101)₁₆", "(01101101)₁₆", "(01111101)₁₆", "(11101101)₁₆"], "ans": "(01111101)₁₆", "repeat": false, "note": ""}, {"exam": "2025–2026", "num": 3, "q": "What is the decimal value of hexadecimal 1DF?", "opts": ["479", "379", "579", "567"], "ans": "479", "repeat": false, "note": ""}, {"exam": "2025–2026", "num": 4, "q": "Find the 2’s complement of 11010011.", "opts": ["01101001", "00101101", "00100100", "10010101"], "ans": "00101101", "repeat": false, "note": ""}, {"exam": "2025–2026", "num": 5, "q": "Convert octal 345 to binary.", "opts": ["11000011", "111100101", "11101101", "10111100"], "ans": "11100101", "repeat": false, "note": ""}, {"exam": "2025–2026", "num": 6, "q": "Convert (F5)₁₆ to decimal.", "opts": ["244", "254", "145", "245"], "ans": "245", "repeat": false, "note": ""}, {"exam": "2025–2026", "num": 7, "q": "Convert binary (0010110101)₂ to hexadecimal.", "opts": ["(0C5)₁₆", "(0A5)₁₆", "(0B5)₁₆", "(0E5)₁₆"], "ans": "(0B5)₁₆", "repeat": false, "note": ""}, {"exam": "2025–2026", "num": 8, "q": "Find the 1’s complement of 100111.", "opts": ["011000", "1001110", "0110110", "1000101"], "ans": "011000", "repeat": false, "note": ""}, {"exam": "2025–2026", "num": 9, "q": "Subtract 10011 from 11001 (binary).", "opts": ["11101", "11011", "00110", "10011"], "ans": "00110", "repeat": false, "note": ""}, {"exam": "2025–2026", "num": 10, "q": "Perform ABCDF + 9FDCA (hexadecimal).", "opts": ["A9DA9", "B9DA9", "B9E9A", "C9DA9"], "ans": "B9DA9", "repeat": false, "note": ""}, {"exam": "2025–2026", "num": 11, "q": "Which register stores the instruction currently being executed?", "opts": ["Instruction register", "Counter register", "Both A and B", "None of these"], "ans": "Instruction register", "repeat": false, "note": ""}, {"exam": "2025–2026", "num": 12, "q": "An assembly instruction can be represented in the form of:", "opts": ["Octal digit", "Decimal", "Hexadecimal", "None of these"], "ans": "Hexadecimal", "repeat": false, "note": ""}, {"exam": "2025–2026", "num": 13, "q": "Which group of registers can contain input data, memory addresses, and result data?", "opts": ["Input data only", "Memory addresses only", "Result data only", "All of these"], "ans": "All of these", "repeat": false, "note": ""}, {"exam": "2025–2026", "num": 14, "q": "AH stands for:", "opts": ["Accumulator high", "Address high", "Appropriate high", "Application high"], "ans": "Accumulator high", "repeat": false, "note": ""}, {"exam": "2025–2026", "num": 15, "q": "BP stands for:", "opts": ["Bit pointer", "Base pointer", "Bus pointer", "Byte pointer"], "ans": "Base pointer", "repeat": false, "note": ""}, {"exam": "2025–2026", "num": 16, "q": "A register is usually the ______ level of memory access by the microprocessor.", "opts": ["First level", "Second level", "Third level", "Fourth level"], "ans": "First level", "repeat": false, "note": ""}, {"exam": "2025–2026", "num": 17, "q": "Causing a flag to become 0 is called:", "opts": ["Set a flag", "Clearing a flag", "Both A and B", "None of these"], "ans": "Clearing a flag", "repeat": false, "note": ""}, {"exam": "2025–2026", "num": 18, "q": "CS stands for:", "opts": ["Code segment", "Coot segment", "Cost segment", "Counter segment"], "ans": "Code segment", "repeat": false, "note": ""}, {"exam": "2025–2026", "num": 19, "q": "DI stands for:", "opts": ["Delete index", "Defect index", "Definition index", "Destination index"], "ans": "Destination index", "repeat": false, "note": ""}, {"exam": "2025–2026", "num": 20, "q": "DS stands for:", "opts": ["Data segment", "Direct segment", "Declare segment", "Divide segment"], "ans": "Data segment", "repeat": false, "note": ""}, {"exam": "2025–2026", "num": 21, "q": "Eight of the registers in x86 are known as:", "opts": ["General-purpose registers", "Pointer or index registers", "Segment registers", "Other registers"], "ans": "General-purpose registers", "repeat": false, "note": ""}, {"exam": "2025–2026", "num": 22, "q": "Perform ABEDA − 5FDEF (hexadecimal).", "opts": ["4F0FE", "4F0FF", "4F1FE", "5F0FE"], "ans": "4F0FE", "repeat": false, "note": ""}, {"exam": "2025–2026", "num": 23, "q": "A chip has a capacity of 1 MB and is organized as 64K words of 4 bits. What is the size of the address bus?", "opts": ["8 bit", "32 bit", "20 bit", "16 bit"], "ans": "16 bit", "repeat": false, "note": ""}, {"exam": "2025–2026", "num": 24, "q": "In Assembly language programming, the minimum number of operands required for an instruction is:", "opts": ["One", "Two", "Three", "Zero"], "ans": "Zero", "repeat": false, "note": ""}, {"exam": "2025–2026", "num": 25, "q": "How can we make computers work faster?", "opts": ["Fetch-execute cycle and pipelining", "Using assembly language", "Both A and B", "None of these"], "ans": "Both A and B", "repeat": false, "note": ""}, {"exam": "2025–2026", "num": 26, "q": "How many parts are in a general instruction format?", "opts": ["1", "2", "3", "4"], "ans": "2", "repeat": false, "note": ""}, {"exam": "2025–2026", "num": 27, "q": "Perform hexadecimal addition 8FAB + B7E8.", "opts": ["14793", "14783", "14693", "14893"], "ans": "14793", "repeat": false, "note": ""}, {"exam": "2025–2026", "num": 28, "q": "In which register is an instruction decoded, prepared, and ultimately executed?", "opts": ["Instruction register", "Current register", "Both A and B", "None of these"], "ans": "Instruction register", "repeat": false, "note": ""}, {"exam": "2025–2026", "num": 29, "q": "INT instruction stands for:", "opts": ["Input", "Interrupt", "Both A and B", "None of these"], "ans": "Interrupt", "repeat": false, "note": ""}, {"exam": "2025–2026", "num": 30, "q": "IR stands for:", "opts": ["Intel register", "In counter register", "Index register", "Instruction register"], "ans": "Instruction register", "repeat": false, "note": ""}];
const repeatedTexts=[
"An instruction tells the CPU what to do.",
"The IP register is",
];
function isRepeated(q){
 if(q.repeat) return true;
 const s=q.q.toLowerCase();
 return s.includes("instruction tells the cpu") || s.includes("ip register is");
}
let current=[...allQuestions], submitted=false;
const quiz=document.getElementById('quiz');
function render(){
 submitted=false; document.getElementById('result').style.display='none';
 quiz.innerHTML='';
 current.forEach((item,index)=>{
  const card=document.createElement('section');card.className='question';card.dataset.index=index;
  const meta=document.createElement('div');meta.className='meta';
  meta.innerHTML=`<span class="badge">${item.exam}</span><span>السؤال ${item.num}</span>${isRepeated(item)?'<span class="badge repeat">⭐ متكرر — اعملي عليه علامة</span>':''}`;
  const q=document.createElement('div');q.className='qtext';q.textContent=item.q;
  card.append(meta,q);
  item.opts.forEach((opt,j)=>{
   const lab=document.createElement('label');lab.className='option';
   const inp=document.createElement('input');inp.type='radio';inp.name='q'+index;inp.value=opt;
   const span=document.createElement('span');span.textContent=String.fromCharCode(65+j)+'. '+opt;
   lab.append(inp,span);card.append(lab);
  });
  const fb=document.createElement('div');fb.className='feedback';fb.id='fb'+index;card.append(fb);
  if(item.note){const n=document.createElement('div');n.className='note';n.textContent='ملاحظة: '+item.note;card.append(n);}
  quiz.append(card);
 });
 updateProgress();
}
function updateProgress(){
 const done=current.filter((_,i)=>document.querySelector('input[name="q'+i+'"]:checked')).length;
 document.getElementById('progress').textContent=`تمت الإجابة على ${done} من ${current.length}`;
}
quiz.addEventListener('change',updateProgress);
document.getElementById('submit').onclick=()=>{
 if(submitted)return;
 let score=0,answered=0;
 current.forEach((item,i)=>{
  const chosen=document.querySelector('input[name="q'+i+'"]:checked');
  const card=document.querySelector(`[data-index="${i}"]`);
  const fb=document.getElementById('fb'+i);
  if(chosen)answered++;
  const correct=chosen && chosen.value===item.ans;
  if(correct)score++;
  card.querySelectorAll('.option').forEach((lab,j)=>{
   const val=item.opts[j];
   if(val===item.ans)lab.classList.add('correct');
   if(chosen && val===chosen.value && !correct)lab.classList.add('wrong');
   lab.querySelector('input').disabled=true;
  });
  fb.className='feedback '+(correct?'good':'bad');
  fb.textContent=(correct?'✓ إجابة صحيحة':'✗ الإجابة الصحيحة: '+item.ans)+(chosen?'':' — لم تختاري إجابة');
 });
 submitted=true;
 const box=document.getElementById('result');box.style.display='block';
 const pct=Math.round(score/current.length*100);
 box.innerHTML=`<div>نتيجتك</div><div class="score">${score} / ${current.length}</div><div>${pct}% — أجبتِ عن ${answered} سؤالًا</div><p>${pct>=85?'ممتاز جدًا!':pct>=65?'شغل كويس، راجعي الأخطاء.':'راجعي الإجابات الخاطئة وحاولي مرة أخرى.'}</p>`;
 box.scrollIntoView({behavior:'smooth',block:'center'});
};
document.getElementById('reset').onclick=render;
document.getElementById('filter').onchange=(e)=>{
 const f=e.target.value;current=allQuestions.filter(x=>f==='all'||x.exam===f);render();
};
document.getElementById('shuffle').onclick=()=>{
 for(let i=current.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[current[i],current[j]]=[current[j],current[i]];}
 render();
};
render();
</script></body></html>
